name: update-stocks

on:
  workflow_dispatch: {}          # ปุ่ม "อัปเดตตอนนี้" ในเว็บเรียกอันนี้
  schedule:
    - cron: "17 22 * * 1-5"      # อัตโนมัติ จ.–ศ. 22:17 UTC = 05:17 เวลาไทย (หลังตลาดสหรัฐฯ ปิด)

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas anthropic
      - name: Update data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "no changes" || git commit -m "update data $(date -u +%F)"
          git push
